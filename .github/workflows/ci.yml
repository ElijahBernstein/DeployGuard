name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -v

      - name: Build Docker image
        run: docker build --tag deployguard:ci .

      - name: Scan Docker image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: deployguard:ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          vuln-type: os,library
          exit-code: 0


  terraform:
    name: Terraform checks
    runs-on: ubuntu-latest

    steps:
      - name: Download repository code
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.9"

      - name: Check Terraform formatting
        run: terraform -chdir=infra fmt -check -recursive

      - name: Initialize main Terraform configuration
        run: terraform -chdir=infra init -backend=false

      - name: Validate main Terraform configuration
        run: terraform -chdir=infra validate

      - name: Initialize bootstrap Terraform configuration
        run: terraform -chdir=infra/bootstrap init -backend=false

      - name: Validate bootstrap Terraform configuration
        run: terraform -chdir=infra/bootstrap validate